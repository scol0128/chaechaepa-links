<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>채채파 구매링크</title>
<meta name="description" content="채채파 쇼츠 상품 번호로 구매 링크를 찾으세요">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;background:#f4f5f7;color:#111;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 60px}
header{text-align:center;padding:28px 0 14px}
header img{width:72px;height:72px;border-radius:50%;object-fit:cover;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header h1{font-size:22px;font-weight:800;margin-top:10px}
.lead{background:#fff;border-radius:14px;padding:16px;margin:8px 0 12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.lead b{display:block;font-size:17px;margin-bottom:6px}
.lead p{font-size:14px;color:#444}
.disc{font-size:12px;color:#777;line-height:1.6;margin-top:10px}
.search{position:sticky;top:0;z-index:5;background:#f4f5f7;padding:8px 0 10px}
.search input{width:100%;font-size:18px;padding:14px 16px;border-radius:12px;border:2px solid #111;outline:none;background:#fff}
.count{font-size:12px;color:#888;margin:2px 4px 8px}
.card{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;text-decoration:none;color:inherit;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card:active{transform:scale(.99)}
.no{min-width:54px;text-align:center;font-size:20px;font-weight:800;color:#e8343b}
.card img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#eee;flex-shrink:0}
.t{flex:1;font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.go{flex-shrink:0;background:#111;color:#fff;font-size:13px;font-weight:700;border-radius:9px;padding:9px 11px}
.more{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#fff;font-size:15px;font-weight:700;margin-top:6px}
.empty{text-align:center;color:#888;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
<header><img src="profile.jpg" alt=""><h1>채채파</h1></header>
<div class="lead"><b>🔗 상품 바로 구매 링크</b><p>영상에 나온 <b style="display:inline;font-size:14px">상품 번호</b>를 아래 검색창에 입력해 주세요!</p>
<div class="disc">👉 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다<br>👉 알리 익스프레스 제휴로, 활동에 따른 일정액의 수수료를 제공받습니다<br>👉 네이버 쇼핑 커넥트 활동의 일환으로, 판매 발생 시 수수료를 제공받습니다.</div></div>
<div class="search"><input id="q" type="search" inputmode="search" placeholder="상품 번호 또는 상품명 검색 (예: 839)" autocomplete="off"></div>
<div class="count" id="cnt"></div>
<div id="list"></div>
<button class="more" id="more">더 보기</button>
</div>
<script>
let ALL=[],shown=0,cur=[];const PAGE=40;
const L=document.getElementById('list'),Q=document.getElementById('q'),M=document.getElementById('more'),C=document.getElementById('cnt');
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function card(p){return `<a class="card" href="${esc(p.l)}" target="_blank" rel="noopener sponsored"><div class="no">${p.n}</div><img loading="lazy" src="t/${p.n}.jpg" onerror="this.style.visibility='hidden'" alt=""><div class="t">${esc(p.t)}</div><div class="go">구매</div></a>`}
function render(reset){if(reset){L.innerHTML='';shown=0}const part=cur.slice(shown,shown+PAGE);L.insertAdjacentHTML('beforeend',part.map(card).join(''));shown+=part.length;M.style.display=shown<cur.length?'block':'none';if(!cur.length)L.innerHTML='<div class="empty">찾는 상품이 없어요. 번호를 다시 확인해 주세요.</div>';C.textContent=`${cur.length.toLocaleString()}개 상품`}
function search(){const v=Q.value.trim();if(!v){cur=ALL}else if(/^\d+$/.test(v)){const ex=ALL.filter(p=>String(p.n)===v);cur=ex.length?ex:ALL.filter(p=>String(p.n).startsWith(v))}else{const w=v.toLowerCase().split(/\s+/);cur=ALL.filter(p=>w.every(x=>p.t.toLowerCase().includes(x)))}render(true)}
Q.addEventListener('input',search);M.onclick=()=>render(false);
fetch('products.json?v='+Date.now()).then(r=>r.json()).then(d=>{ALL=d;const h=(location.hash||'').slice(1)||new URLSearchParams(location.search).get('q');if(h){Q.value=decodeURIComponent(h)}search()});
</script>
</body>
</html>
